name: Build plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: EmeraldTools
          path: target/EmeraldTools-2.0.0.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          files: target/EmeraldTools-2.0.0.jar
          make_latest: true
